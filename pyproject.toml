[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "lockscope"
version = "0.1.0"
description = "Offline deadlock witnesses and blocked-dependent analysis for lock snapshots"
requires-python = ">=3.11"
license = "MIT"
[project.scripts]
lockscope = "lockscope:main"
[tool.setuptools]
py-modules = ["lockscope"]
